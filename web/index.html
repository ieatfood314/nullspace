<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>Nullspace</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="title">Tasks</h1>
  <span id="count" class="count"></span>
  <span id="status" class="status" hidden></span>
  <button id="settings" class="icon" aria-label="Phone settings" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.1-1.64-2-3.46-2.48 1a7.6 7.6 0 0 0-1.68-.97L15 3.3h-4l-.37 2.66c-.6.24-1.17.57-1.68.97l-2.48-1-2 3.46 2.1 1.64a7.8 7.8 0 0 0 0 1.94l-2.1 1.64 2 3.46 2.48-1c.51.4 1.08.73 1.68.97L11 20.7h4l.37-2.66c.6-.24 1.17-.57 1.68-.97l2.48 1 2-3.46-2.1-1.64Z"/></svg>
  </button>
</header>

<nav id="views" class="views" aria-label="Views"></nav>

<main id="view"></main>

<footer class="bottom">
  <form id="capture" class="capture" autocomplete="off">
    <input id="say" name="say" placeholder="Add anything" aria-label="Add a task, note or reminder" enterkeyhint="send">
    <button id="send" type="submit" aria-label="Add">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 4 5 11l1.4 1.4L11 7.8V20h2V7.8l4.6 4.6L19 11z"/></svg>
    </button>
  </form>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="tasks" class="on">Tasks</button>
    <button data-tab="notes">Notes</button>
    <button data-tab="captures">Captures</button>
    <button data-tab="places">Places</button>
  </nav>
</footer>

<dialog id="sheet"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
